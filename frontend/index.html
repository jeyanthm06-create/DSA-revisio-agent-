<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Revision Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 24px;
        }

        h1 {
            color: #00d4ff;
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 32px;
            font-size: 0.9rem;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #fff;
        }

        .section {
            margin-bottom: 40px;
        }

        .due-card {
            background: #1a1a2e;
            border-left: 4px solid #ff4757;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .due-card .file {
            font-weight: 600;
            color: #ff6b81;
        }

        .due-card .meta {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #222;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.88rem;
        }

        tr:hover td {
            background: #222;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-blue {
            background: #1e3a5f;
            color: #00d4ff;
        }

        .badge-green {
            background: #1a3a2a;
            color: #2ed573;
        }

        .empty {
            color: #555;
            font-style: italic;
            padding: 20px 0;
        }

        .loading {
            color: #555;
            padding: 20px 0;
        }
    </style>
</head>

<body>

    <h1>DSA Revision Agent</h1>
    <p class="subtitle">Auto-analyzed solutions — powered by Gemini AI</p>

    <div class="section">
        <h2>🔴 Due for Revision Today</h2>
        <div id="due-list">
            <p class="loading">Loading...</p>
        </div>
    </div>

    <div class="section">
        <h2>📚 All Solutions</h2>
        <table>
            <thead>
                <tr>
                    <th>File</th>
                    <th>Topic</th>
                    <th>Pattern</th>
                    <th>Time</th>
                    <th>Space</th>
                    <th>Revise in</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="solutions-table">
                <tr>
                    <td colspan="7" class="loading">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const BASE = '';

        async function loadDue() {
            const res = await fetch(`${BASE}/due-today`);
            const data = await res.json();
            const el = document.getElementById('due-list');
            if (!data.due || data.due.length === 0) {
                el.innerHTML = '<p class="empty">Nothing due today. Keep solving!</p>';
                return;
            }
            el.innerHTML = data.due.map(s => `
    <div class="due-card">
      <div class="file">${s.file_path}</div>
      <div class="meta">${s.topic} · ${s.pattern} · ${s.time_complexity}</div>
    </div>
  `).join('');
        }

        async function loadSolutions() {
            const res = await fetch(`${BASE}/solutions`);
            const data = await res.json();
            const tbody = document.getElementById('solutions-table');
            if (!data.solutions || data.solutions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty">No solutions yet. Push a .c file to get started.</td></tr>';
                return;
            }
            tbody.innerHTML = data.solutions.map(s => `
    <tr>
      <td>${s.file_path}</td>
      <td><span class="badge badge-blue">${s.topic || '-'}</span></td>
      <td><span class="badge badge-green">${s.pattern || '-'}</span></td>
      <td>${s.time_complexity || '-'}</td>
      <td>${s.space_complexity || '-'}</td>
      <td>${s.next_revision_days || '-'} days</td>
      <td>${new Date(s.created_at).toLocaleDateString()}</td>
    </tr>
  `).join('');
        }

        loadDue();
        loadSolutions();
    </script>
</body>

</html>
